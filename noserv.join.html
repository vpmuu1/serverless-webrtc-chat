<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>JOIN WebRTC channel (Socket.io) + 连接诊断</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
    h2 { margin-bottom: 8px; }
    #status { font-weight: normal; color: #666; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; margin: 4px 0 12px; font-family: monospace; }
    button { padding: 8px 16px; cursor: pointer; margin-right: 8px; }
    #chat { border: 1px solid #ccc; border-radius: 8px; overflow: hidden; margin-top: 16px; }
    #chat-screen-wp { height: 280px; overflow-y: auto; background: #fafafa; padding: 8px; }
    .wrap { margin: 6px 0; }
    .me .msg { background: #dcf8c6; }
    .other .msg { background: #fff; border: 1px solid #ddd; }
    .info .msg { background: #e8f0fe; color: #1a73e8; }
    .who { font-size: 11px; color: #888; margin-right: 6px; }
    .msg { display: inline-block; padding: 6px 10px; border-radius: 12px; max-width: 80%; word-break: break-word; }
    #ct { display: flex; gap: 8px; padding: 8px; border-top: 1px solid #eee; }
    #ct input { flex: 1; }
    .hint { font-size: 13px; color: #666; margin-bottom: 12px; }
    .log { font-size: 12px; color: #888; margin-top: 8px; white-space: pre-wrap; max-height: 220px; overflow-y: auto; background:#0b1120; color:#e2e8f0; padding:8px; border-radius:8px; }
    .log .time { color:#64748b; }
    .tag { font-weight:600; padding:0 4px; border-radius:3px; font-size:11px; }
    .tag-host { background:#1e3a5f; color:#93c5fd; }
    .tag-srflx { background:#2d3a1e; color:#bef264; }
    .tag-relay { background:#4a1e1e; color:#fca5a5; }
    .tag-prflx { background:#3a2e1e; color:#fdba74; }
    #path-banner { margin-top:12px; padding:10px 14px; border-radius:10px; display:none; font-weight:600; }
    #path-banner.direct { background:#f0fdf4; border-left:5px solid #22c55e; color:#166534; }
    #path-banner.turn { background:#fef2f2; border-left:5px solid #ef4444; color:#991b1b; }
    #path-banner.mixed { background:#fffbeb; border-left:5px solid #f59e0b; color:#92400e; }
  </style>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<h2>JOIN WebRTC channel <span id="status">init</span></h2>
<p class="hint">
  双方填写<strong>相同房间号</strong>。创建方先点「创建并等待」，你再点「加入」。
</p>

<label>信令服务器地址</label>
<input type="text" id="signal-url" value="https://preview-23e30aa938773200.up.railway.app">

<label>房间号 (双方相同)</label>
<input type="text" id="room-id" value="demo-room-1">

<button id="btn-join">加入房间</button>

<div id="path-banner"></div>

<h3>CHAT</h3>
<div id="chat">
  <div id="chat-screen-wp"><div id="chat-screen"></div></div>
  <div id="ct">
    <input id="msg" disabled placeholder="连接成功后可聊天">
    <button id="send" disabled>send</button>
  </div>
</div>
<div class="log" id="log"></div>

<script>
let pc = null;
let dc = null;
let socket = null;
let roomId = null;
let localSdpSent = false;
let pendingCandidates = [];
let offerHandled = false;

const iceConfig = {
  iceServers: [
    { urls: "stun:stun.miwifi.com:3478" },
    { urls: "stun:stun.chat.bilibili.com:3478" },
    { urls: "turn:global.relay.metered.ca:80", username: "3043870328f476eb7b83f1f5", credential: "SqE9Pbn6+saRzOZS" },
    { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: "3043870328f476eb7b83f1f5", credential: "SqE9Pbn6+saRzOZS" },
    { urls: "turn:global.relay.metered.ca:443", username: "3043870328f476eb7b83f1f5", credential: "SqE9Pbn6+saRzOZS" },
    { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: "3043870328f476eb7b83f1f5", credential: "SqE9Pbn6+saRzOZS" },
  ]
};

function log(msg, tag) {
  console.log(msg);
  const el = document.getElementById("log");
  const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
  let tagHtml = '';
  if (tag) {
    const map = {
      host: '<span class="tag tag-host">host</span>',
      srflx: '<span class="tag tag-srflx">srflx</span>',
      relay: '<span class="tag tag-relay">relay</span>',
      prflx: '<span class="tag tag-prflx">prflx</span>',
    };
    tagHtml = map[tag] || `<span class="tag">${tag}</span>`;
  }
  el.innerHTML += `<span class="time">${time}</span>  ${msg} ${tagHtml}\n`;
  el.scrollTop = 99999;
}
function setStatus(s) { document.getElementById("status").textContent = s; }
function addMSG(msg, who) {
  const wrap = document.createElement("div");
  wrap.className = "wrap";
  const div = document.createElement("div");
  div.className = who;
  div.innerHTML = `<span class="who">${who}</span><span class="msg">${msg}</span>`;
  wrap.appendChild(div);
  document.getElementById("chat-screen").appendChild(wrap);
  document.getElementById("chat-screen-wp").scrollTop = 99999;
}
function enableChat() {
  document.getElementById("msg").disabled = false;
  document.getElementById("send").disabled = false;
}

function parseCandidateType(candidateStr) {
  if (!candidateStr) return null;
  const parts = candidateStr.split(' ');
  const idx = parts.indexOf('typ');
  if (idx !== -1 && parts[idx + 1]) return parts[idx + 1];
  return null;
}

async function addRemoteCandidate(cand) {
  if (!pc) {
    pendingCandidates.push(cand);
    log("queue candidate (no pc yet)");
    return;
  }
  if (!pc.remoteDescription) {
    pendingCandidates.push(cand);
    log("queue candidate (no remoteDescription yet)");
    return;
  }
  try {
    await pc.addIceCandidate(new RTCIceCandidate(cand));
  } catch (e) {
    log("addIceCandidate error: " + e.message);
  }
}

async function flushPendingCandidates() {
  while (pendingCandidates.length) {
    const c = pendingCandidates.shift();
    try {
      await pc.addIceCandidate(new RTCIceCandidate(c));
      log("flushed candidate");
    } catch (e) {
      log("flush candidate error: " + e.message);
    }
  }
}

function connectSignaling(url) {
  return new Promise((resolve, reject) => {
    socket = io(url, { transports: ["websocket", "polling"] });

    socket.on("connect", () => {
      setStatus("ws-open");
      log("Socket connected: " + socket.id);
      socket.emit("join", roomId);
      addMSG("已加入房间，等待创建方发送 Offer…", "info");
      resolve();
    });

    socket.on("connect_error", (err) => {
      log("connect_error: " + err.message);
      reject(err);
    });

    socket.on("disconnect", (reason) => {
      setStatus("ws-closed");
      log("disconnected: " + reason);
    });

    socket.on("peer-joined", ({ peerId }) => {
      log("peer-joined: " + peerId);
    });

    socket.on("signal", async ({ from, type, data }) => {
      log("← signal " + type + " from " + from);
      if (type === "offer") {
        await handleRemoteOffer(data);
      } else if (type === "ice-candidate" && data) {
        await addRemoteCandidate(data);
      }
    });
  });
}

function sendLocalSdp(kind) {
  if (!pc || !pc.localDescription) return;
  socket.emit("signal", {
    roomId,
    type: kind,
    data: pc.localDescription
  });
  localSdpSent = true;
  setStatus(kind + " sent");
  addMSG(kind + " 已发送", "info");
  log("→ " + kind);
}

// 连接成功后，用 getStats 分析选中的 candidate pair
async function analyzeSelectedPair(pc) {
  try {
    const stats = await pc.getStats();
    let selectedPair = null;
    stats.forEach(r => {
      if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated) selectedPair = r;
    });
    if (!selectedPair) {
      stats.forEach(r => {
        if (r.type === 'candidate-pair' && r.state === 'succeeded') selectedPair = r;
      });
    }
    if (!selectedPair) { log("[诊断] 未找到成功的候选者对"); return; }

    let localCand = null, remoteCand = null;
    stats.forEach(r => {
      if (r.type === 'local-candidate' && r.id === selectedPair.localCandidateId) localCand = r;
      if (r.type === 'remote-candidate' && r.id === selectedPair.remoteCandidateId) remoteCand = r;
    });

    const lt = localCand ? localCand.candidateType : 'unknown';
    const rt = remoteCand ? remoteCand.candidateType : 'unknown';
    log(`[诊断] 选中候选对: local=${lt} ↔ remote=${rt}`, null);

    const banner = document.getElementById('path-banner');
    const detail = `local:${lt} / remote:${rt}`;
    if (lt === 'relay' || rt === 'relay') {
      banner.className = 'turn';
      banner.style.display = 'block';
      banner.textContent = `🔄 使用了 TURN 中继 (${detail})`;
      log(`[诊断] 结论: 使用 TURN 中继`);
    } else {
      banner.className = 'direct';
      banner.style.display = 'block';
      banner.textContent = `✅ 直连 P2P (${detail})`;
      log(`[诊断] 结论: 直连 P2P`);
    }
  } catch (e) {
    log("[诊断] getStats 错误: " + e.message);
  }
}

function createPeerConnection() {
  pc = new RTCPeerConnection(iceConfig);
  localSdpSent = false;

  pc.onicecandidate = (ev) => {
    if (ev.candidate) {
      const t = parseCandidateType(ev.candidate.candidate);
      if (t) log(`本地候选者类型: ${t}`, t);
      socket.emit("signal", {
        roomId,
        type: "ice-candidate",
        data: ev.candidate
      });
    }
  };

  pc.oniceconnectionstatechange = () => {
    const state = pc.iceConnectionState;
    setStatus(state);
    log("iceConnectionState = " + state);
    if (state === "connected" || state === "completed") {
      enableChat();
      setTimeout(() => analyzeSelectedPair(pc), 500);
    }
    if (state === "failed") addMSG("ICE 失败，可能需要更好的 TURN 或换网络", "info");
  };

  pc.onicegatheringstatechange = () => {
    log("iceGatheringState = " + pc.iceGatheringState);
    if (pc.iceGatheringState === "complete" && !localSdpSent && pc.localDescription && pc.localDescription.type === "answer") {
      sendLocalSdp("answer");
    }
  };

  setTimeout(() => {
    if (!localSdpSent && pc && pc.localDescription && pc.localDescription.type === "answer") {
      log("timeout → force send answer");
      sendLocalSdp("answer");
    }
  }, 2000);

  pc.ondatachannel = (ev) => {
    dc = ev.channel;
    dc.onopen = () => { addMSG("CONNECTED!", "info"); enableChat(); log("DataChannel open"); };
    dc.onmessage = (e) => { if (e.data) addMSG(e.data, "other"); };
    dc.onclose = () => addMSG("DataChannel closed", "info");
  };
}

async function handleRemoteOffer(sdp) {
  if (offerHandled) {
    log("ignore duplicate offer");
    return;
  }
  offerHandled = true;
  addMSG("已收到 Offer，正在生成 Answer…", "info");
  if (pc) {
    try { pc.close(); } catch (e) {}
    pc = null;
  }
  createPeerConnection();
  try {
    await pc.setRemoteDescription(new RTCSessionDescription(sdp));
    log("setRemoteDescription(offer) ok");
    await flushPendingCandidates();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    log("setLocalDescription(answer) done, waiting ICE…");
  } catch (err) {
    offerHandled = false;
    log("handleRemoteOffer failed: " + err.message);
    addMSG("处理 Offer 失败: " + err.message, "info");
  }
}

function sendMSG() {
  const value = document.getElementById("msg").value.trim();
  if (value && dc && dc.readyState === "open") {
    dc.send(value);
    addMSG(value, "me");
    document.getElementById("msg").value = "";
  }
}

document.getElementById("btn-join").onclick = async () => {
  const url = document.getElementById("signal-url").value.trim();
  roomId = document.getElementById("room-id").value.trim();
  if (!roomId) { alert("请填写房间号"); return; }
  if (!url) { alert("请填写信令服务器地址"); return; }

  document.getElementById("btn-join").disabled = true;
  setStatus("connecting…");
  offerHandled = false;
  pendingCandidates = [];
  document.getElementById('path-banner').style.display = 'none';

  try {
    await connectSignaling(url);
  } catch (e) {
    setStatus("failed");
    addMSG("连接信令失败: " + (e.message || e), "info");
    document.getElementById("btn-join").disabled = false;
  }
};

document.getElementById("msg").onkeypress = (e) => { if (e.which === 13) sendMSG(); };
document.getElementById("send").onclick = sendMSG;
</script>
</body>
</html>
