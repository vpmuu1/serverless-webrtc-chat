<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>JOIN WebRTC channel (Socket.io)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
    h2 { margin-bottom: 8px; }
    #status { font-weight: normal; color: #666; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; margin: 4px 0 12px; font-family: monospace; }
    button { padding: 8px 16px; cursor: pointer; margin-right: 8px; }
    #chat { border: 1px solid #ccc; border-radius: 8px; overflow: hidden; margin-top: 16px; }
    #chat-screen-wp { height: 280px; overflow-y: auto; background: #fafafa; padding: 8px; }
    .wrap { margin: 6px 0; }
    .me .msg { background: #dcf8c6; }
    .other .msg { background: #fff; border: 1px solid #ddd; }
    .info .msg { background: #e8f0fe; color: #1a73e8; }
    .who { font-size: 11px; color: #888; margin-right: 6px; }
    .msg { display: inline-block; padding: 6px 10px; border-radius: 12px; max-width: 80%; word-break: break-word; }
    #ct { display: flex; gap: 8px; padding: 8px; border-top: 1px solid #eee; }
    #ct input { flex: 1; }
    .hint { font-size: 13px; color: #666; margin-bottom: 12px; }
    .log { font-size: 12px; color: #888; margin-top: 8px; white-space: pre-wrap; max-height: 160px; overflow-y: auto; }
  </style>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<h2>JOIN WebRTC channel <span id="status">init</span></h2>
<p class="hint">
  双方填写<strong>相同房间号</strong>。创建方先点「创建并等待」，你再点「加入」。
</p>

<label>信令服务器地址</label>
<input type="text" id="signal-url" value="https://preview-23e30aa938773200.up.railway.app">

<label>房间号 (双方相同)</label>
<input type="text" id="room-id" value="demo-room-1">

<button id="btn-join">加入房间</button>

<h3>CHAT</h3>
<div id="chat">
  <div id="chat-screen-wp"><div id="chat-screen"></div></div>
  <div id="ct">
    <input id="msg" disabled placeholder="连接成功后可聊天">
    <button id="send" disabled>send</button>
  </div>
</div>
<div class="log" id="log"></div>

<script>
let pc = null;
let dc = null;
let socket = null;
let roomId = null;
let localSdpSent = false;
let pendingCandidates = [];
let offerHandled = false;

const iceConfig = {
  iceServers: [
    { urls: "stun:stun.miwifi.com:3478" },
    { urls: "stun:stun.chat.bilibili.com:3478" },
    {
      urls: "turn:global.relay.metered.ca:80",
      username: "3043870328f476eb7b83f1f5",
      credential: "SqE9Pbn6+saRzOZS",
    },
    {
      urls: "turn:global.relay.metered.ca:80?transport=tcp",
      username: "3043870328f476eb7b83f1f5",
      credential: "SqE9Pbn6+saRzOZS",
    },
    {
      urls: "turn:global.relay.metered.ca:443",
      username: "3043870328f476eb7b83f1f5",
      credential: "SqE9Pbn6+saRzOZS",
    },
    {
      urls: "turns:global.relay.metered.ca:443?transport=tcp",
      username: "3043870328f476eb7b83f1f5",
      credential: "SqE9Pbn6+saRzOZS",
    },
  ]
};

function log(msg) {
  console.log(msg);
  const el = document.getElementById("log");
  el.textContent += new Date().toLocaleTimeString() + "  " + msg + "\n";
  el.scrollTop = 99999;
}
function setStatus(s) { document.getElementById("status").textContent = s; }
function addMSG(msg, who) {
  const wrap = document.createElement("div");
  wrap.className = "wrap";
  const div = document.createElement("div");
  div.className = who;
  div.innerHTML = `<span class="who">${who}</span><span class="msg">${msg}</span>`;
  wrap.appendChild(div);
  document.getElementById("chat-screen").appendChild(wrap);
  document.getElementById("chat-screen-wp").scrollTop = 99999;
}
function enableChat() {
  document.getElementById("msg").disabled = false;
  document.getElementById("send").disabled = false;
}

async function addRemoteCandidate(cand) {
  if (!pc) {
    pendingCandidates.push(cand);
    log("queue candidate (no pc yet)");
    return;
  }
  if (!pc.remoteDescription) {
    pendingCandidates.push(cand);
    log("queue candidate (no remoteDescription yet)");
    return;
  }
  try {
    await pc.addIceCandidate(new RTCIceCandidate(cand));
  } catch (e) {
    log("addIceCandidate error: " + e.message);
  }
}

async function flushPendingCandidates() {
  while (pendingCandidates.length) {
    const c = pendingCandidates.shift();
    try {
      await pc.addIceCandidate(new RTCIceCandidate(c));
      log("flushed candidate");
    } catch (e) {
      log("flush candidate error: " + e.message);
    }
  }
}

function connectSignaling(url) {
  return new Promise((resolve, reject) => {
    socket = io(url, { transports: ["websocket", "polling"] });

    socket.on("connect", () => {
      setStatus("ws-open");
      log("Socket connected: " + socket.id);
      socket.emit("join", roomId);
      addMSG("已加入房间，等待创建方发送 Offer…", "info");
      resolve();
    });

    socket.on("connect_error", (err) => {
      log("connect_error: " + err.message);
      reject(err);
    });

    socket.on("disconnect", (reason) => {
      setStatus("ws-closed");
      log("disconnected: " + reason);
    });

    socket.on("peer-joined", ({ peerId }) => {
      log("peer-joined: " + peerId);
    });

    socket.on("signal", async ({ from, type, data }) => {
      log("← signal " + type + " from " + from);
      if (type === "offer") {
        await handleRemoteOffer(data);
      } else if (type === "ice-candidate" && data) {
        await addRemoteCandidate(data);
      }
    });
  });
}

function sendLocalSdp(kind) {
  if (!pc || !pc.localDescription) return;
  socket.emit("signal", {
    roomId,
    type: kind,
    data: pc.localDescription
  });
  localSdpSent = true;
  setStatus(kind + " sent");
  addMSG(kind + " 已发送", "info");
  log("→ " + kind);
}

function createPeerConnection() {
  pc = new RTCPeerConnection(iceConfig);
  localSdpSent = false;

  pc.onicecandidate = (ev) => {
    if (ev.candidate) {
      socket.emit("signal", {
        roomId,
        type: "ice-candidate",
        data: ev.candidate
      });
    }
  };

  pc.oniceconnectionstatechange = () => {
    const state = pc.iceConnectionState;
    setStatus(state);
    log("iceConnectionState = " + state);
    if (state === "connected" || state === "completed") enableChat();
    if (state === "failed") addMSG("ICE 失败，可能需要更好的 TURN 或换网络", "info");
  };

  pc.onicegatheringstatechange = () => {
    log("iceGatheringState = " + pc.iceGatheringState);
    if (pc.iceGatheringState === "complete" && !localSdpSent && pc.localDescription && pc.localDescription.type === "answer") {
      sendLocalSdp("answer");
    }
  };

  setTimeout(() => {
    if (!localSdpSent && pc && pc.localDescription && pc.localDescription.type === "answer") {
      log("timeout → force send answer");
      sendLocalSdp("answer");
    }
  }, 2000);

  pc.ondatachannel = (ev) => {
    dc = ev.channel;
    dc.onopen = () => { addMSG("CONNECTED!", "info"); enableChat(); log("DataChannel open"); };
    dc.onmessage = (e) => { if (e.data) addMSG(e.data, "other"); };
    dc.onclose = () => addMSG("DataChannel closed", "info");
  };
}

async function handleRemoteOffer(sdp) {
  if (offerHandled) {
    log("ignore duplicate offer");
    return;
  }
  offerHandled = true;
  addMSG("已收到 Offer，正在生成 Answer…", "info");
  if (pc) {
    try { pc.close(); } catch (e) {}
    pc = null;
  }
  createPeerConnection();
  try {
    await pc.setRemoteDescription(new RTCSessionDescription(sdp));
    log("setRemoteDescription(offer) ok");
    await flushPendingCandidates();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    log("setLocalDescription(answer) done, waiting ICE…");
  } catch (err) {
    offerHandled = false;
    log("handleRemoteOffer failed: " + err.message);
    addMSG("处理 Offer 失败: " + err.message, "info");
  }
}

function sendMSG() {
  const value = document.getElementById("msg").value.trim();
  if (value && dc && dc.readyState === "open") {
    dc.send(value);
    addMSG(value, "me");
    document.getElementById("msg").value = "";
  }
}

document.getElementById("btn-join").onclick = async () => {
  const url = document.getElementById("signal-url").value.trim();
  roomId = document.getElementById("room-id").value.trim();
  if (!roomId) { alert("请填写房间号"); return; }
  if (!url) { alert("请填写信令服务器地址"); return; }

  document.getElementById("btn-join").disabled = true;
  setStatus("connecting…");
  offerHandled = false;
  pendingCandidates = [];

  try {
    await connectSignaling(url);
  } catch (e) {
    setStatus("failed");
    addMSG("连接信令失败: " + (e.message || e), "info");
    document.getElementById("btn-join").disabled = false;
  }
};

document.getElementById("msg").onkeypress = (e) => { if (e.which === 13) sendMSG(); };
document.getElementById("send").onclick = sendMSG;
</script>
</body>
</html>
